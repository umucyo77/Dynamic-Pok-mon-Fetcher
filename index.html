<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body   class="min-h-sreen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-700 to-pink-500 ">

    <div>
        <!-- main card -->
        <div class="bg-white dark:bg-gray-500 rounde-2xl shadow-xl p-6 text-center transformation transition-500 ">
            <h1 class="text-2xl font-bold mb-4 text-gray-800 dark:text-white">Pokemo Explorer</h1>

            <!-- input -->
            <div class="flex gap-2 mb-4">
                <input id="pokemoIpt" type="text" class="flex-1 px-3 py-2 border  focus:ring-2   rounded-2xl "
                    placeholder="Enter your Id or name">
                <button id="fetchBtn" type="button" class="rounded-lg px-8 py-3 bg-indigo-500 text-white hover:bg-indigo-700 hover:scale-105 transition" value="Fetch">
                    Fetch
                </button>
            </div>


            <!-- Loading spinner -->
            <div id="loading" class="hidden flex justify-center my-4">
                <div class="w-8 h-8 border-4 border-white rounded-full border-t-transparent animate-spin"></div>
            </div>
            
            <!-- Pokemon Display -->
             
            <div id="pokemoCard" class="mt-5 hidden"></div>

            <!-- error message -->

            <div id="error" class="text-red-600 font-semibold"></div>
    </div> 

    <script src="script.js"></script>
</body>
</html>
